name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: project_start
          POSTGRES_PASSWORD: project_start
          # conftest expects this name — tests TRUNCATE it, never the dev DB
          POSTGRES_DB: project_start_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U project_start"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://project_start:project_start@localhost:5432/project_start_test
      MAX_BOT_TOKEN: test-bot-token
      JWT_SECRET: ci-secret
      ADMIN_PASSWORD: ci-admin
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: dependency integrity
        run: pip check
      - name: apply database migrations
        run: alembic upgrade head
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node's --experimental-strip-types runs the .mts unit tests without
          # a bundler or an extra test framework dependency.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: dependency audit
        run: npm audit
      - name: typecheck
        run: npm run lint
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
        env:
          # Build must not depend on runtime env values that only exist on the
          # deploy host — CI proves the static bundle builds from scratch.
          VITE_API_BASE_URL: /api
