<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ключевые экраны мини-приложения Старт</title>
  <desc id="desc">Диагностика навыков, объяснимый подбор проектов и подтверждённое портфолио</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07132f"/>
      <stop offset="0.52" stop-color="#12265c"/>
      <stop offset="1" stop-color="#3d2377"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#93c5fd">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>

  <text x="600" y="64" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Один путь от самооценки до реального опыта</text>
  <text x="600" y="96" fill="#a5b4d4" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Мини-приложение в MAX · объяснимый скоринг · подтверждение организатором</text>

  <!-- Screen 1 -->
  <g transform="translate(70 130)" filter="url(#shadow)">
    <rect width="310" height="520" rx="34" fill="#f8fafc" stroke="#93c5fd" stroke-width="2"/>
    <rect x="112" y="14" width="86" height="8" rx="4" fill="#cbd5e1"/>
    <text x="28" y="68" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">ШАГ 2 ИЗ 5</text>
    <text x="28" y="105" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">React и интерфейсы</text>
    <text x="28" y="134" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Насколько знакома технология?</text>
    <g font-family="Inter, Arial, sans-serif" font-size="14">
      <rect x="24" y="164" width="262" height="54" rx="16" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="50" cy="191" r="8" fill="#e2e8f0"/><text x="70" y="197" fill="#475569">Не знаком</text>
      <rect x="24" y="230" width="262" height="54" rx="16" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="50" cy="257" r="8" fill="#bfdbfe"/><text x="70" y="263" fill="#475569">Слышал, но не пробовал</text>
      <rect x="24" y="296" width="262" height="60" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="50" cy="326" r="9" fill="#6366f1"/><circle cx="50" cy="326" r="3" fill="#ffffff"/><text x="70" y="322" fill="#312e81" font-weight="600">Изучал самостоятельно</text><text x="70" y="342" fill="#6366f1" font-size="12">понимаю основы</text>
      <rect x="24" y="368" width="262" height="54" rx="16" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="50" cy="395" r="8" fill="#bfdbfe"/><text x="70" y="401" fill="#475569">Применял в проекте</text>
    </g>
    <rect x="24" y="450" width="262" height="46" rx="16" fill="url(#accent)"/>
    <text x="155" y="480" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Дальше →</text>
    <text x="155" y="548" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">01 · Быстрая диагностика</text>
  </g>

  <!-- connector -->
  <path d="M398 385h45" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <path d="m436 376 11 9-11 9" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Screen 2 -->
  <g transform="translate(445 130)" filter="url(#shadow)">
    <rect width="310" height="520" rx="34" fill="#071124" stroke="#818cf8" stroke-width="2"/>
    <rect x="112" y="14" width="86" height="8" rx="4" fill="#334155"/>
    <text x="28" y="67" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">ПРИВЕТ, СТУДЕНТ 👋</text>
    <text x="28" y="103" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Твой подбор</text>
    <rect x="24" y="128" width="262" height="112" rx="20" fill="#1e2a57"/>
    <text x="44" y="160" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="14">✦ Лучшее совпадение</text>
    <text x="44" y="188" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Бот-навигатор</text>
    <text x="44" y="211" fill="#a5b4fc" font-family="Inter, Arial, sans-serif" font-size="13">Навыки 16/40 · Роль 25/25</text>
    <rect x="24" y="254" width="262" height="198" rx="22" fill="#101b31" stroke="#334155" stroke-width="2"/>
    <text x="44" y="284" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12">ПРОЕКТНЫЙ ОФИС</text>
    <rect x="218" y="266" width="50" height="28" rx="14" fill="url(#accent)"/>
    <text x="243" y="286" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">43%</text>
    <text x="44" y="322" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Бот для мероприятий</text>
    <rect x="44" y="342" width="92" height="26" rx="13" fill="#dcfce7"/>
    <circle cx="58" cy="355" r="4" fill="#10b981"/><text x="70" y="360" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="12">Начальный</text>
    <rect x="40" y="386" width="230" height="48" rx="14" fill="#172554"/>
    <text x="54" y="407" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">✦ Почему тебе</text>
    <text x="54" y="424" fill="#a5b4fc" font-family="Inter, Arial, sans-serif" font-size="11">роль и уровень совпадают</text>
    <text x="155" y="548" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">02 · Объяснимый подбор</text>
  </g>

  <!-- connector -->
  <path d="M773 385h45" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <path d="m811 376 11 9-11 9" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Screen 3 -->
  <g transform="translate(820 130)" filter="url(#shadow)">
    <rect width="310" height="520" rx="34" fill="#f8fafc" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="112" y="14" width="86" height="8" rx="4" fill="#cbd5e1"/>
    <text x="28" y="70" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Портфолио</text>
    <text x="28" y="99" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">Подтверждённый опыт студента</text>
    <rect x="24" y="126" width="262" height="78" rx="20" fill="url(#accent)"/>
    <text x="44" y="158" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">3 проекта</text>
    <text x="44" y="182" fill="#ddd6fe" font-family="Inter, Arial, sans-serif" font-size="12">2 роли · 8 освоенных навыков</text>
    <rect x="24" y="220" width="262" height="158" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="250" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="11">УНИВЕРСИТЕТСКИЙ ПРОЕКТНЫЙ ОФИС</text>
    <text x="44" y="280" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Навигатор мероприятий</text>
    <text x="44" y="304" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13">Backend developer</text>
    <rect x="44" y="324" width="118" height="28" rx="14" fill="#dcfce7"/>
    <text x="103" y="343" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ подтверждено</text>
    <rect x="24" y="394" width="262" height="46" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="155" y="423" fill="#4338ca" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Создать публичную ссылку</text>
    <text x="155" y="548" fill="#ddd6fe" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">03 · Проверенный результат</text>
  </g>
</svg>
